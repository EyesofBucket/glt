# GoReleaser builds the release binaries when a version tag is pushed (see
# .github/workflows/release.yml). Try it locally with:
#   goreleaser release --snapshot --clean
version: 2

project_name: glt

builds:
  - main: ./cmd/glt
    binary: glt
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

# plain binaries, no archives: glt-<version>-<os>-<arch>, plus .exe on
# Windows (added by GoReleaser)
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt
  extra_files:
    - glob: ./README.md

changelog:
  use: github-native

release:
  name_template: "glt {{ .Tag }}"
  prerelease: auto
  # the README is its own asset, next to the binaries
  extra_files:
    - glob: ./README.md
